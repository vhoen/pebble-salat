# Generated by dev-workflow-mcp — set gitlab.project_id before /jira-done
project_name: pebble-salat
repo_path: "/home/vhoen/src/pebble-salat"
default_target_branch: develop
branch_name_pattern: "feature/{jira_key}-{slug}"
max_branch_name_length: 50
require_solution_approval_if_multiple: true

language: javascript

gitlab:
  project_id: ""

tests:
  min_coverage_percent: 90
  unit_test_command: "npm test -- --coverage --coverageDirectory=.coverage"
  coverage_command: "npm test -- --coverage --coverageDirectory=.coverage --coverageReporters=text-summary --coverageReporters=html"
  coverage_report_path: ".coverage/index.html"

lint:
  command: ""
  config_path: ""
  packages: ""

quality:
  gates:
    lint: "off"
    race: "off"
    vuln: "off"
    coverage: required
    unit_tests: required

jira:
  project_key: "RUN"
  in_progress_status_name: "In Progress"
  to_be_tested_status_name: "To Be Tested"

commit:
  message_pattern: "[{jira_key}] {message}"

caveman:
  enabled: false
  level: lite
  mcp_shrink: false
  trace: false
  trace_level: info
  always_on: false
  exempt_skills:
    - jira-done
    - jira-review
